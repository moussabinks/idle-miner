<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : sur iPhone, le jeu va jusque sous l'encoche (on garde des marges avec env(safe-area-inset-*)). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mega Digger</title>
    <meta name="description" content="Mega Digger, idle game de minage : creuse, vends tes minerais et descends jusqu'à la bedrock." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Application installable (PWA) : le manifeste, la couleur de la barre du téléphone et les icônes. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#15151a" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mega Digger" />

    <!-- La police du logo MEGA DIGGER (Luckiest Guy) ; hors ligne, le jeu utilise Arial Black. -->
    <!-- La police des icônes du jeu (27/10) : chargée tout de suite, pour ne pas voir les emojis avant. -->
    <link rel="preload" href="/fonts/icones-mega.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
