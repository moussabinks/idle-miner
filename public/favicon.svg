<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- L'icône d'Idle Miner : un bloc de terre avec du minerai, et une pioche dorée. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e3c"/>
      <stop offset="1" stop-color="#15151a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#fond)"/>
  <!-- Le bloc : herbe en haut, terre dessous, avec des pixels plus clairs et plus foncés. -->
  <g transform="translate(116 176)">
    <rect width="280" height="280" fill="#8a5a33"/>
    <rect width="280" height="70" fill="#5cc95c"/>
    <rect y="70" width="35" height="35" fill="#5cc95c"/>
    <rect x="105" y="70" width="35" height="35" fill="#5cc95c"/>
    <rect x="210" y="70" width="35" height="35" fill="#5cc95c"/>
    <rect x="35" width="35" height="35" fill="#7ad97a"/>
    <rect x="175" y="35" width="35" height="35" fill="#46a846"/>
    <rect x="70" y="140" width="35" height="35" fill="#6e4628"/>
    <rect x="210" y="210" width="35" height="35" fill="#6e4628"/>
    <rect x="35" y="245" width="35" height="35" fill="#a06b3f"/>
    <!-- Les diamants. -->
    <rect x="140" y="140" width="35" height="35" fill="#4ee8dc"/>
    <rect x="175" y="175" width="35" height="35" fill="#4ee8dc"/>
    <rect x="35" y="175" width="35" height="35" fill="#4ee8dc"/>
    <rect x="245" y="140" width="35" height="35" fill="#4ee8dc"/>
    <rect width="280" height="280" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="10"/>
  </g>
  <!-- La pioche, posée en travers au-dessus du bloc. -->
  <g transform="rotate(-38 256 210)">
    <rect x="240" y="120" width="32" height="250" rx="10" fill="#7a4a24" stroke="#3b230f" stroke-width="8"/>
    <path d="M110 150 Q256 50 402 150 L384 176 Q256 104 128 176 Z" fill="#f2b33d" stroke="#6b4a10" stroke-width="10" stroke-linejoin="round"/>
    <rect x="228" y="108" width="56" height="44" rx="8" fill="#c98f22" stroke="#6b4a10" stroke-width="8"/>
  </g>
</svg>
